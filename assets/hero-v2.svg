<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Krish Singh — Student Developer</title>
  <desc id="desc">Animated student laboratory and code window for Krish Singh.</desc>

  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38B2AC"/>
    </linearGradient>

    <filter id="heroGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .fade {
        animation: fadePulse 3s ease-in-out infinite alternate;
      }

      .pulse {
        animation: systemPulse 2s ease-in-out infinite;
      }

      .cursor {
        animation: cursorBlink 1s steps(1) infinite;
      }

      @keyframes fadePulse {
        0% { opacity: .45; }
        100% { opacity: 1; }
      }

      @keyframes systemPulse {
        0%, 100% { opacity: .3; }
        50% { opacity: 1; }
      }

      @keyframes cursorBlink {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="#0D1117"/>

  <rect
    x="18" y="18" width="1164" height="584" rx="22"
    fill="none"
    stroke="url(#heroGradient)"
    stroke-width="2"
    opacity=".85"
  />

  <text x="600" y="72" text-anchor="middle"
        class="mono" font-size="34" font-weight="700"
        fill="#E6EDF3">KRISH SINGH</text>

  <text x="600" y="105" text-anchor="middle"
        class="mono" font-size="16"
        fill="#8B949E">STUDENT DEVELOPER • AI • PHYSICS • SOFTWARE</text>

  <!-- STUDENT LAB -->
  <g transform="translate(70 145)">
    <rect width="465" height="350" rx="18"
          fill="#111827" stroke="#A855F7" stroke-width="2"/>

    <text x="28" y="42" class="mono"
          font-size="15" font-weight="700"
          fill="#A855F7">📖 STUDENT LAB</text>

    <line x1="28" y1="62" x2="437" y2="62"
          stroke="#6A5ACD" opacity=".5"/>

    <text x="35" y="112" class="mono"
          font-size="20" fill="#E6EDF3">PHYSICS</text>

    <text x="35" y="157" class="mono"
          font-size="20" fill="#E6EDF3">MATHEMATICS</text>

    <text x="35" y="202" class="mono"
          font-size="20" fill="#E6EDF3">COMPUTER SCIENCE</text>

    <text x="35" y="247" class="mono"
          font-size="18" fill="#E6EDF3">ARTIFICIAL INTELLIGENCE</text>

    <!-- animated book mark -->
    <path d="M350 292 Q395 255 425 292"
          fill="none" stroke="#38B2AC"
          stroke-width="3" class="fade"/>

    <circle cx="386" cy="278" r="7"
            fill="#38B2AC"
            filter="url(#heroGlow)"
            class="pulse"/>

    <text x="35" y="310" class="mono"
          font-size="13" fill="#8B949E">PAGE 01 / ∞</text>
  </g>

  <!-- CODE WINDOW -->
  <g transform="translate(575 145)">
    <rect width="555" height="350" rx="18"
          fill="#0F172A" stroke="#6366F1" stroke-width="2"/>

    <circle cx="30" cy="31" r="6" fill="#A855F7"/>
    <circle cx="52" cy="31" r="6" fill="#6366F1"/>
    <circle cx="74" cy="31" r="6" fill="#38B2AC"/>

    <text x="105" y="36" class="mono"
          font-size="14" fill="#8B949E">krish.py</text>

    <line x1="22" y1="60" x2="533" y2="60"
          stroke="#6366F1" opacity=".35"/>

    <text x="28" y="103" class="mono"
          font-size="17" font-weight="700"
          fill="#A855F7">class</text>

    <text x="87" y="103" class="mono"
          font-size="17" fill="#E6EDF3"> KrishSingh:</text>

    <text x="48" y="146" class="mono"
          font-size="17" fill="#38B2AC">learn()</text>

    <text x="48" y="186" class="mono"
          font-size="17" fill="#38B2AC">build()</text>

    <text x="48" y="226" class="mono"
          font-size="17" fill="#38B2AC">experiment()</text>

    <text x="48" y="266" class="mono"
          font-size="17" fill="#6366F1">understand()</text>

    <text x="48" y="310" class="mono"
          font-size="15" fill="#8B949E"># build something worth exploring</text>

    <rect x="48" y="322" width="9" height="18"
          fill="#A855F7" class="cursor"/>
  </g>

  <text x="600" y="548" text-anchor="middle"
        class="mono" font-size="17"
        fill="#8B949E">LEARN → BUILD → BREAK → UNDERSTAND</text>

  <text x="600" y="580" text-anchor="middle"
        class="mono pulse" font-size="14"
        font-weight="700" fill="#22C55E">● SYSTEM: BUILDING</text>
</svg>
