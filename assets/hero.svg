<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#A855F7"/>
    <stop offset=".5" stop-color="#6366F1"/>
    <stop offset="1" stop-color="#38B2AC"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .fade{animation:f 3s ease-in-out infinite alternate}
    .pulse{animation:p 2s ease-in-out infinite}
    @keyframes f{from{opacity:.55}to{opacity:1}}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
    .cursor{animation:blink 1s steps(1) infinite}
  </style>
</defs>
<rect width="1200" height="620" rx="28" fill="#0D1117"/>
<rect x="18" y="18" width="1164" height="584" rx="22" fill="none" stroke="url(#g)" stroke-width="2" opacity=".8"/>
<text x="600" y="72" text-anchor="middle" class="t" font-size="34" font-weight="700" fill="#E6EDF3">KRISH SINGH</text>
<text x="600" y="105" text-anchor="middle" class="t" font-size="16" fill="#8B949E">STUDENT DEVELOPER • AI • PHYSICS • SOFTWARE</text>

<g transform="translate(70 145)">
  <rect width="465" height="350" rx="18" fill="#111827" stroke="#A855F7" stroke-width="2"/>
  <text x="28" y="42" class="t" font-size="15" fill="#A855F7">📖  STUDENT LAB</text>
  <line x1="28" y1="62" x2="437" y2="62" stroke="#6A5ACD" opacity=".5"/>
  <text x="35" y="112" class="t" font-size="20" fill="#E6EDF3">PHYSICS</text>
  <text x="35" y="157" class="t" font-size="20" fill="#E6EDF3">MATHEMATICS</text>
  <text x="35" y="202" class="t" font-size="20" fill="#E6EDF3">COMPUTER SCIENCE</text>
  <text x="35" y="247" class="t" font-size="20" fill="#E6EDF3">ARTIFICIAL INTELLIGENCE</text>
  <path d="M350 292 Q395 255 425 292" fill="none" stroke="#38B2AC" stroke-width="3" class="fade"/>
  <circle cx="386" cy="278" r="7" fill="#38B2AC" filter="url(#glow)" class="pulse"/>
  <text x="35" y="310" class="t" font-size="13" fill="#8B949E">PAGE 01 / ∞</text>
</g>

<g transform="translate(575 145)">
  <rect width="555" height="350" rx="18" fill="#0F172A" stroke="#6366F1" stroke-width="2"/>
  <circle cx="30" cy="31" r="6" fill="#A855F7"/><circle cx="52" cy="31" r="6" fill="#6366F1"/><circle cx="74" cy="31" r="6" fill="#38B2AC"/>
  <text x="105" y="36" class="t" font-size="14" fill="#8B949E">krish.py</text>
  <line x1="22" y1="60" x2="533" y2="60" stroke="#6366F1" opacity=".35"/>
  <text x="28" y="103" class="t" font-size="17" fill="#A855F7">class</text><text x="87" y="103" class="t" font-size="17" fill="#E6EDF3"> KrishSingh:</text>
  <text x="48" y="146" class="t" font-size="17" fill="#38B2AC">learn()</text>
  <text x="48" y="186" class="t" font-size="17" fill="#38B2AC">build()</text>
  <text x="48" y="226" class="t" font-size="17" fill="#38B2AC">experiment()</text>
  <text x="48" y="266" class="t" font-size="17" fill="#6366F1">understand()</text>
  <text x="48" y="310" class="t" font-size="15" fill="#8B949E"># build something worth exploring</text>
  <rect x="48" y="322" width="9" height="18" fill="#A855F7" class="cursor"/>
</g>

<text x="600" y="548" text-anchor="middle" class="t" font-size="17" fill="#8B949E">LEARN → BUILD → BREAK → UNDERSTAND</text>
<text x="600" y="580" text-anchor="middle" class="t" font-size="14" fill="#22C55E" class="pulse">● SYSTEM: BUILDING</text>
</svg>